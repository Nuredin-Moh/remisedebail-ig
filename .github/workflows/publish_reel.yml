name: publier un reel sur la Page Facebook

# Lancement MANUEL uniquement. N'a aucun lien avec daily.yml :
# ce workflow ne touche ni schedule.json, ni last.json, ni Instagram.
on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "URL publique du MP4 (1080x1920, H.264/AAC)"
        required: true
        type: string
      caption:
        description: "Legende / description du Reel"
        required: true
        type: string

permissions:
  contents: read

jobs:
  reel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - name: Publier le Reel via l'API Graph (start / file_url / finish)
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          VIDEO_URL: ${{ inputs.video_url }}
          CAPTION: ${{ inputs.caption }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request, urllib.parse, urllib.error

          TOKEN = os.environ["IG_TOKEN"]
          PAGE  = os.environ["FB_PAGE_ID"]
          URL   = os.environ["VIDEO_URL"]
          CAP   = os.environ["CAPTION"]
          V = "v21.0"
          BASE = "https://graph.facebook.com/%s/" % V

          def montre(titre, code, corps):
              print("=" * 72)
              print(titre, "-> HTTP", code)
              try:
                  print(json.dumps(json.loads(corps), indent=2, ensure_ascii=False))
              except Exception:
                  print(corps[:4000])
              print("=" * 72, flush=True)

          def appel(titre, url, data=None, headers=None, methode=None):
              """Renvoie (code, corps_texte, objet_json_ou_None). N'echoue jamais en silence."""
              corps = data.encode() if isinstance(data, str) else data
              req = urllib.request.Request(url, data=corps, headers=headers or {}, method=methode)
              try:
                  with urllib.request.urlopen(req) as r:
                      txt = r.read().decode("utf-8", "replace")
                      code = r.status
              except urllib.error.HTTPError as e:
                  txt = e.read().decode("utf-8", "replace")
                  code = e.code
              except urllib.error.URLError as e:
                  montre(titre, "ERREUR RESEAU", str(e.reason))
                  return None, str(e.reason), None
              montre(titre, code, txt)
              try:
                  return code, txt, json.loads(txt)
              except Exception:
                  return code, txt, None

          print("Page:", PAGE)
          print("Video:", URL)
          print("Legende:", len(CAP), "caracteres")

          # -- Verification prealable de l'URL de la video (HEAD) -----------------
          try:
              req = urllib.request.Request(URL, method="HEAD")
              with urllib.request.urlopen(req) as r:
                  print("HEAD video ->", r.status,
                        r.headers.get("Content-Type"),
                        r.headers.get("Content-Length"), "octets", flush=True)
          except Exception as e:
              print("HEAD video -> echec:", e, flush=True)

          # -- Qui est ce jeton ? (aucun secret affiche) --------------------------
          appel("GET /me (identite du jeton)",
                BASE + "me?" + urllib.parse.urlencode(
                    {"fields": "id,name", "access_token": TOKEN}))
          appel("GET /{page}?fields=id,name,tasks",
                BASE + PAGE + "?" + urllib.parse.urlencode(
                    {"fields": "id,name,tasks", "access_token": TOKEN}))

          # -- PHASE 1 : start ---------------------------------------------------
          code, txt, js = appel(
              "PHASE 1 - POST /{page}/video_reels (upload_phase=start)",
              BASE + PAGE + "/video_reels",
              data=urllib.parse.urlencode(
                  {"upload_phase": "start", "access_token": TOKEN}))
          if not js or "video_id" not in js:
              raise SystemExit("ECHEC phase start : pas de video_id renvoye (voir la reponse ci-dessus).")
          vid = js["video_id"]
          upload_url = js.get("upload_url") or (
              "https://rupload.facebook.com/video-upload/%s/%s" % (V, vid))
          print("video_id =", vid)
          print("upload_url =", upload_url, flush=True)

          # -- PHASE 2 : envoi par file_url --------------------------------------
          code, txt, js2 = appel(
              "PHASE 2 - POST rupload (file_url)",
              upload_url,
              data=b"",
              headers={"Authorization": "OAuth " + TOKEN, "file_url": URL},
              methode="POST")
          if code != 200:
              raise SystemExit("ECHEC phase d'envoi (voir la reponse ci-dessus).")

          # -- Attente du traitement cote Meta -----------------------------------
          for i in range(40):
              time.sleep(15)
              c, t, st = appel(
                  "ETAT du traitement (essai %d/40)" % (i + 1),
                  BASE + vid + "?" + urllib.parse.urlencode(
                      {"fields": "status", "access_token": TOKEN}))
              phases = (st or {}).get("status", {}) if isinstance(st, dict) else {}
              vs = phases.get("video_status") or phases.get("uploading_phase", {}).get("status")
              proc = phases.get("processing_phase", {}).get("status")
              print(">> video_status =", vs, "| processing =", proc, flush=True)
              if proc in ("complete", "error") or vs in ("ready", "error", "processing_complete"):
                  break

          # -- PHASE 3 : finish + publication ------------------------------------
          code, txt, js3 = appel(
              "PHASE 3 - POST /{page}/video_reels (upload_phase=finish, video_state=PUBLISHED)",
              BASE + PAGE + "/video_reels",
              data=urllib.parse.urlencode({
                  "video_id": vid,
                  "upload_phase": "finish",
                  "video_state": "PUBLISHED",
                  "description": CAP,
                  "access_token": TOKEN,
              }))

          # -- Etat final + lien -------------------------------------------------
          time.sleep(20)
          appel("ETAT FINAL de la video",
                BASE + vid + "?" + urllib.parse.urlencode(
                    {"fields": "status,permalink_url,published,post_id",
                     "access_token": TOKEN}))
          appel("DERNIERS REELS DE LA PAGE",
                BASE + PAGE + "/video_reels?" + urllib.parse.urlencode(
                    {"fields": "id,permalink_url,description,updated_time",
                     "limit": "5", "access_token": TOKEN}))

          if code != 200 or not js3 or not js3.get("success", True):
              raise SystemExit("ECHEC phase finish (voir la reponse ci-dessus).")
          print("Phase finish acceptee. video_id =", vid)
          PY
