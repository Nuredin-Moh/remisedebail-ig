name: supprimer une publication de la Page Facebook

# Lancement MANUEL uniquement. Ne touche ni schedule.json, ni last.json, ni Instagram.
on:
  workflow_dispatch:
    inputs:
      post_id:
        description: "Identifiant de la publication a supprimer (ex: 122139976185069084)"
        required: true
        type: string
      video_id:
        description: "Identifiant de la video / du Reel (ex: 1385192097017700)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  supprimer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - name: Supprimer via l'API Graph (DELETE /{post_id})
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          POST_ID: ${{ inputs.post_id }}
          VIDEO_ID: ${{ inputs.video_id }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.parse, urllib.error

          TOKEN = os.environ["IG_TOKEN"]
          PAGE  = os.environ["FB_PAGE_ID"]
          POST  = os.environ["POST_ID"]
          BASE  = "https://graph.facebook.com/v21.0/"

          def montre(titre, code, corps):
              print("=" * 72)
              print(titre, "-> HTTP", code)
              try:
                  print(json.dumps(json.loads(corps), indent=2, ensure_ascii=False))
              except Exception:
                  print(corps[:4000])
              print("=" * 72, flush=True)

          def appel(titre, url, data=None, methode=None):
              corps = data.encode() if isinstance(data, str) else data
              req = urllib.request.Request(url, data=corps, method=methode)
              try:
                  with urllib.request.urlopen(req) as r:
                      txt = r.read().decode("utf-8", "replace"); code = r.status
              except urllib.error.HTTPError as e:
                  txt = e.read().decode("utf-8", "replace"); code = e.code
              except urllib.error.URLError as e:
                  montre(titre, "ERREUR RESEAU", str(e.reason))
                  return None, str(e.reason), None
              montre(titre, code, txt)
              try:
                  return code, txt, json.loads(txt)
              except Exception:
                  return code, txt, None

          print("Page:", PAGE, "| cible:", POST)

          # L'identifiant "brut" d'un Reel n'est pas toujours adressable tel quel.
          # On essaie les formes connues, dans l'ordre, et on s'arrete au premier succes.
          candidats = [POST, PAGE + "_" + POST]
          autre = os.environ.get("VIDEO_ID", "").strip()
          if autre:
              candidats = [autre, PAGE + "_" + autre] + candidats

          ok = False
          for cible in candidats:
              c, t, j = appel(
                  "DELETE /" + cible,
                  BASE + cible + "?" + urllib.parse.urlencode({"access_token": TOKEN}),
                  methode="DELETE")
              if c == 200 and isinstance(j, dict) and j.get("success"):
                  print(">> supprime via", cible, flush=True)
                  ok = True
                  break

          appel("REELS RESTANTS DE LA PAGE",
                BASE + PAGE + "/video_reels?" + urllib.parse.urlencode(
                    {"fields": "id,permalink_url,description,updated_time",
                     "limit": "10", "access_token": TOKEN}))

          if not ok:
              raise SystemExit("ECHEC de la suppression (voir les reponses ci-dessus).")
          print("Publication supprimee.")
          PY
